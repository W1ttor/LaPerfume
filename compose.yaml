services:
  db:
    image: postgres:18-alpine
    container_name: la-perfume
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: laperfume
    ports:
      - "5439:5432"
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
